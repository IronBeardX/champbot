<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>ChampBot</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <h1>ChampBot</h1>
        <p class="disclaimer">Unofficial demo, not affiliated with Air India.</p>
      </header>
      <ol id="conversation" aria-live="polite">
        <li class="turn assistant greeting">
          Hello! I'm ChampBot, an unofficial assistant for Air India travellers. Ask me about
          flights, baggage, check-in or bookings, in English or Hindi.
        </li>
      </ol>
      <section class="suggestions" aria-label="Suggested questions">
        <button type="button" class="chip">How much cabin baggage can I carry?</button>
        <button type="button" class="chip">Flights from Delhi to Mumbai next Friday</button>
        <button type="button" class="chip" lang="hi">क्या मैं अपनी बुकिंग रद्द करके रिफंड पा सकता हूँ?</button>
        <button type="button" class="chip" lang="hi">अगले शुक्रवार दिल्ली से लंदन की उड़ानें दिखाइए</button>
      </section>
      <form id="chat-form">
        <div class="composer">
          <label for="message" class="visually-hidden">Your question</label>
          <textarea
            id="message"
            name="message"
            required
            maxlength="2000"
            rows="2"
            placeholder="Ask a question…"
          ></textarea>
          <div class="actions">
            <button id="new-conversation" type="button">New conversation</button>
            <button id="send" type="submit">Send</button>
          </div>
        </div>
      </form>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
