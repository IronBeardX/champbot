<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChampBot</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <h1>ChampBot</h1>
        <p class="disclaimer">Unofficial demo, not affiliated with Air India.</p>
      </header>
      <ol id="conversation" aria-live="polite">
        <li class="turn assistant greeting">
          Hello! I'm ChampBot, an unofficial assistant for Air India travellers. Ask me about
          flights, baggage, check-in or bookings, in English or Hindi.
        </li>
      </ol>
      <form id="chat-form">
        <label for="message">Your question</label>
        <textarea id="message" name="message" required maxlength="2000" rows="4"></textarea>
        <div class="actions">
          <button id="new-conversation" type="button">New conversation</button>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
